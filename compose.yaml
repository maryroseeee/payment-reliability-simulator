name: payment-reliability-simulator

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: payment_reliability
      POSTGRES_USER: simulator
      # Fixed credentials for this local development database.
      POSTGRES_PASSWORD: simulator_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "simulator", "-d", "payment_reliability"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
