name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: payment_reliability
          POSTGRES_USER: simulator
          POSTGRES_PASSWORD: simulator_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simulator -d payment_reliability"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://simulator:simulator_dev@127.0.0.1:5432/payment_reliability
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Initialize database
        run: python -m payment_reliability.init_database
      - name: Run tests
        run: python -m pytest -q
